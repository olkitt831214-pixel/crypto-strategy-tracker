<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Strategy Tracker</title>
<style>
:root { --bg:#0f1419; --card:#1a2332; --border:#2d3a4d; --text:#e7ecf3; --muted:#8b9bb4; --green:#22c55e; --red:#ef4444; --yellow:#eab308; --accent:#6366f1; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:16px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
h1 { font-size:1.4rem; font-weight:600; }
.subtitle { color:var(--muted); font-size:0.8rem; }
button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
button.secondary { background:var(--card); border:1px solid var(--border); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:20px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
.card h2 { font-size:0.95rem; margin-bottom:10px; }
.badge { font-size:0.65rem; padding:2px 6px; border-radius:8px; font-weight:600; }
.badge.green { background:rgba(34,197,94,0.2); color:var(--green); }
.badge.yellow { background:rgba(234,179,8,0.2); color:var(--yellow); }
.badge.red { background:rgba(239,68,68,0.2); color:var(--red); }
.badge.top { background:rgba(99,102,241,0.25); color:#a5b4fc; margin-left:6px; }
.coin-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
.coin-name { font-weight:600; }
.coin-detail { font-size:0.75rem; color:var(--muted); }
.status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
.status-dot.triggered { background:var(--green); }
.status-dot.emerging { background:var(--yellow); }
.status-dot.none { background:var(--muted); }
.log-table { width:100%; border-collapse:collapse; font-size:0.75rem; }
.log-table th, .log-table td { text-align:left; padding:5px; border-bottom:1px solid var(--border); white-space:nowrap; }
.form-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
input, select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:0.85rem; }
.tabs { display:flex; gap:2px; margin-bottom:14px; }
.tab { padding:6px 12px; background:transparent; border:none; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-size:0.85rem; }
.tab.active { color:var(--text); border-bottom-color:var(--accent); }
.panel { display:none; }
.panel.active { display:block; }
.loading { color:var(--muted); text-align:center; padding:16px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; margin-bottom:14px; }
.stat { background:var(--bg); padding:10px; border-radius:8px; text-align:center; }
.stat-value { font-size:1.3rem; font-weight:600; }
.stat-label { font-size:0.7rem; color:var(--muted); }
.cond-table { width:100%; font-size:0.75rem; border-collapse:collapse; }
.cond-table th { text-align:center; padding:4px; color:var(--muted); font-weight:500; }
.cond-table td { text-align:center; padding:6px 4px; border-bottom:1px solid var(--border); }
.cond-table td:first-child { text-align:left; font-weight:600; }
.check { color:var(--green); font-weight:bold; }
.cross { color:var(--red); }
.partial { color:var(--yellow); }
.top-coin { font-weight:700; }
.pl-pos { color:var(--green); }
.pl-neg { color:var(--red); }
</style>
</head>
<body>
<div class="header"><div><h1>Crypto Strategy Tracker</h1><div class="subtitle">15/40 SMA + 3-day confirm + 200 SMA + 100 SMA rising (15d) + BTC filter</div></div><div><button onclick="refresh()">Refresh</button> <button class="secondary" onclick="exportLog()">Export</button></div></div>
<div class="tabs"><button class="tab active" onclick="showTab('signals')">Signals</button><button class="tab" onclick="showTab('log')">Trade Log</button><button class="tab" onclick="showTab('settings')">Settings</button></div>
<div id="signals" class="panel active"><div class="stats" id="stats"></div><div class="grid"><div class="card"><h2>Triggered <span class="badge green" id="triggered-count">0</span></h2><div id="triggered-list"><div class="loading">Loading...</div></div></div><div class="card"><h2>Emerging <span class="badge yellow" id="emerging-count">0</span></h2><div id="emerging-list"><div class="loading">Loading...</div></div></div></div><div class="card"><h2>Condition Status</h2><div style="overflow-x:auto"><table class="cond-table" id="cond-table"><thead><tr><th>Coin</th><th>Price</th><th>15>40</th><th>Days</th><th>>200</th><th>100↑</th><th>BTC</th><th>Status</th></tr></thead><tbody id="cond-body"></tbody></table></div></div></div>
<div id="log" class="panel"><div class="card"><h2>Log a Trade</h2>
<div class="form-row">
  <select id="log-coin"></select>
  <input type="number" id="log-entry" placeholder="Entry Price" step="0.01" style="width:110px">
  <input type="number" id="log-exit" placeholder="Exit Price" step="0.01" style="width:110px">
  <input type="number" id="log-atr" placeholder="2.5x ATR" step="0.01" style="width:100px">
  <input type="number" id="log-size" placeholder="Size ($)" step="0.01" style="width:90px">
  <input type="text" id="log-note" placeholder="Note" style="width:120px">
  <button onclick="addLog()">Add</button>
</div>
<div style="overflow-x:auto"><table class="log-table"><thead><tr><th>Date</th><th>Coin</th><th>Entry</th><th>Exit</th><th>2.5x ATR</th><th>Size</th><th>P/L</th><th>P/L %</th><th>Note</th><th></th></tr></thead><tbody id="log-body"></tbody></table></div></div></div>
<div id="settings" class="panel"><div class="card"><h2>Settings</h2><div class="form-row"><label>Fast: <input type="number" id="set-fast" value="15" style="width:50px"></label><label>Slow: <input type="number" id="set-slow" value="40" style="width:50px"></label><label>Confirm: <input type="number" id="set-confirm" value="3" style="width:40px"></label><label>200 SMA: <input type="checkbox" id="set-sma200" checked></label></div><button onclick="saveSettings()">Save</button></div></div>
<script>
const TOP13=['BTC','ETH','BNB','SOL','XRP','ADA','DOGE','AVAX','DOT','LINK','ATOM','LTC','BCH'];
const COINS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','AVAXUSDT','DOTUSDT','LINKUSDT','ATOMUSDT','LTCUSDT','BCHUSDT','AAVEUSDT','ALGOUSDT','NEARUSDT','ICPUSDT','FILUSDT','ETCUSDT','XLMUSDT','VETUSDT','THETAUSDT','EOSUSDT','TRXUSDT','XTZUSDT','NEOUSDT','IOTAUSDT','ZECUSDT','DASHUSDT','WAVESUSDT','ZILUSDT','BATUSDT','MANAUSDT','SANDUSDT','AXSUSDT','ENJUSDT','CHZUSDT','HBARUSDT','QNTUSDT','EGLDUSDT','FLOWUSDT','KSMUSDT'];
let settings={fast:15,slow:40,confirm:3,sma200:true}, log=JSON.parse(localStorage.getItem('tradeLog')||'[]'), coinData={};
function isTop(symbol){return TOP13.includes(symbol);}
function showTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');event.target.classList.add('active');if(id==='log')renderLog();}
function sma(a,n){if(a.length<n)return null;return a.slice(-n).reduce((x,y)=>x+y,0)/n;}
function isRising(closes, period, lookback){
  if(closes.length < period + lookback) return false;
  const curr = sma(closes, period);
  const prev = sma(closes.slice(0, -lookback), period);
  return curr && prev && curr > prev;
}
function checkSignal(c,f,s,conf,u200){
  if(c.length<Math.max(s,200,100)+conf)return{status:'none',days:0,maOk:false,above200:false,slope100:false};
  const price=c.at(-1), sFast=sma(c,f), sSlow=sma(c,s), s200=sma(c,200);
  const maOk=sFast&&sSlow&&sFast>sSlow;
  const above200=!u200||(s200&&price>s200);
  const slope100=isRising(c,100,15);
  let d=0;
  for(let i=0;i<conf;i++){
    const idx=c.length-1-i, ff=sma(c.slice(0,idx+1),f), ss=sma(c.slice(0,idx+1),s), p=c[idx], s2=sma(c,200);
    if(ff&&ss&&ff>ss&&(!u200||(s2&&p>s2)))d++; else break;
  }
  const btcData=coinData['BTCUSDT'];
  const btc=btcData? (btcData.closes.at(-1)>sma(btcData.closes,200) && sma(btcData.closes,15)>sma(btcData.closes,40)) : true;
  let status='none';
  if(d>=conf && btc && slope100)status='triggered';
  else if(d>=conf-1 && d>0 && slope100)status='emerging';
  return{status,days:d,price,maOk,above200,slope100,btc};
}
async function fetchCoin(s){return(await(await fetch(`https://api.binance.com/api/v3/klines?symbol=${s}&interval=1d&limit=300`)).json()).map(d=>parseFloat(d[4]));}
async function refresh(){
  document.getElementById('triggered-list').innerHTML='<div class="loading">Loading...</div>';
  for(const s of COINS){try{coinData[s]={closes:await fetchCoin(s)};}catch(e){}}
  const r=COINS.filter(s=>coinData[s]).map(s=>({symbol:s.replace('USDT',''),...checkSignal(coinData[s].closes,settings.fast,settings.slow,settings.confirm,settings.sma200)}));
  const t=r.filter(x=>x.status==='triggered'), e=r.filter(x=>x.status==='emerging');
  document.getElementById('triggered-count').textContent=t.length;
  document.getElementById('emerging-count').textContent=e.length;
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-value">${t.length}</div><div class="stat-label">Triggered</div></div><div class="stat"><div class="stat-value">${e.length}</div><div class="stat-label">Emerging</div></div><div class="stat"><div class="stat-value">${r.length}</div><div class="stat-label">Coins</div></div><div class="stat"><div class="stat-value">${log.length}</div><div class="stat-label">Logged</div></div>`;
  document.getElementById('triggered-list').innerHTML=t.length?t.map(x=>`<div class="coin-row"><div><span class="status-dot triggered"></span><span class="coin-name ${isTop(x.symbol)?'top-coin':''}">${x.symbol}</span>${isTop(x.symbol)?'<span class="badge top">TOP</span>':''}<div class="coin-detail">$${x.price?.toFixed(2)||'-'}</div></div><span class="badge green">BUY</span></div>`).join(''):'<div class="coin-detail">None</div>';
  document.getElementById('emerging-list').innerHTML=e.length?e.map(x=>`<div class="coin-row"><div><span class="status-dot emerging"></span><span class="coin-name ${isTop(x.symbol)?'top-coin':''}">${x.symbol}</span>${isTop(x.symbol)?'<span class="badge top">TOP</span>':''}<div class="coin-detail">$${x.price?.toFixed(2)||'-'} · ${x.days}/${settings.confirm}</div></div><span class="badge yellow">WATCH</span></div>`).join(''):'<div class="coin-detail">None</div>';
  document.getElementById('cond-body').innerHTML=r.map(x=>`<tr><td class="${isTop(x.symbol)?'top-coin':''}">${x.symbol}${isTop(x.symbol)?' <span class="badge top">TOP</span>':''}</td><td>$${x.price?.toFixed(2)||'-'}</td><td class="${x.maOk?'check':'cross'}">${x.maOk?'\u2713':'\u2717'}</td><td class="${x.days>=settings.confirm?'check':x.days>0?'partial':'cross'}">${x.days}/${settings.confirm}</td><td class="${x.above200?'check':'cross'}">${settings.sma200?(x.above200?'\u2713':'\u2717'):'-'}</td><td class="${x.slope100?'check':'cross'}">${x.slope100?'\u2713':'\u2717'}</td><td class="${x.btc?'check':'cross'}">${x.btc?'\u2713':'\u2717'}</td><td><span class="badge ${x.status==='triggered'?'green':x.status==='emerging'?'yellow':''}">${x.status}</span></td></tr>`).join('');
  document.getElementById('log-coin').innerHTML=COINS.map(c=>`<option value="${c.replace('USDT','')}">${c.replace('USDT','')}</option>`).join('');
}
function addLog(){
  const entry=parseFloat(document.getElementById('log-entry').value)||0;
  const exit=parseFloat(document.getElementById('log-exit').value)||0;
  const atr=parseFloat(document.getElementById('log-atr').value)||0;
  const size=parseFloat(document.getElementById('log-size').value)||0;
  const pl = (exit && entry) ? (exit - entry) * (size / entry) : 0;
  const plPct = (exit && entry) ? ((exit - entry) / entry * 100) : 0;
  log.unshift({
    date:new Date().toISOString().slice(0,10),
    coin:document.getElementById('log-coin').value,
    entry, exit, atr, size, pl, plPct,
    note:document.getElementById('log-note').value
  });
  localStorage.setItem('tradeLog',JSON.stringify(log));
  document.getElementById('log-entry').value='';
  document.getElementById('log-exit').value='';
  document.getElementById('log-atr').value='';
  document.getElementById('log-size').value='';
  document.getElementById('log-note').value='';
  renderLog();
}
function renderLog(){
  document.getElementById('log-body').innerHTML=log.map((e,i)=>{
    const plClass = e.pl>0?'pl-pos':e.pl<0?'pl-neg':'';
    return `<tr>
      <td>${e.date}</td>
      <td>${e.coin}</td>
      <td>$${e.entry?.toFixed(2)||'-'}</td>
      <td>$${e.exit?.toFixed(2)||'-'}</td>
      <td>$${e.atr?.toFixed(2)||'-'}</td>
      <td>$${e.size?.toFixed(0)||'-'}</td>
      <td class="${plClass}">$${e.pl?.toFixed(2)||'0'}</td>
      <td class="${plClass}">${e.plPct?.toFixed(1)||'0'}%</td>
      <td>${e.note||''}</td>
      <td><button class="secondary" onclick="deleteLog(${i})" style="padding:4px 8px">\u00d7</button></td>
    </tr>`;
  }).join('');
}
function deleteLog(i){log.splice(i,1);localStorage.setItem('tradeLog',JSON.stringify(log));renderLog();}
function exportLog(){
  const csv='Date,Coin,Entry,Exit,ATR,Size,PL,PL_Pct,Note\n'+log.map(e=>`${e.date},${e.coin},${e.entry||''},${e.exit||''},${e.atr||''},${e.size||''},${e.pl||''},${e.plPct||''},"${e.note||''}"`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='trade_log.csv';
  a.click();
}
function saveSettings(){settings.fast=parseInt(document.getElementById('set-fast').value)||15;settings.slow=parseInt(document.getElementById('set-slow').value)||40;settings.confirm=parseInt(document.getElementById('set-confirm').value)||3;settings.sma200=document.getElementById('set-sma200').checked;localStorage.setItem('settings',JSON.stringify(settings));refresh();}
const saved=localStorage.getItem('settings');if(saved)settings=JSON.parse(saved);refresh();
</script>
</body>
</html>
